<!DOCTYPE html>
<html>
<head>
    <title>{{ task.title }}</title>
</head>
<body>
    <h1>{{ task.title }}</h1>
      <p>Состояние: {% if task.done %}Готово{% else %}В работе{% endif %}</p>

      <form method="post" action="{% url 'tasks:task_delete' task.id %}">
        {% csrf_token %}
        <button type="submit" class="secondary">Удалить</button>
      </form>
    </main>
</body>
</html>
